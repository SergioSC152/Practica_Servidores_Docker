
services:

  servidor1:
    build: .
    environment:
      SERVIDOR: "Servidor 1"
    expose:
      - "8000"
    restart: unless-stopped


  servidor2:
    build: .
    environment:
      SERVIDOR: "Servidor 2"
    expose:
      - "8000"
    restart: unless-stopped

  servidor3:
    build: .
    environment:
      SERVIDOR: "Servidor 3"
    expose:
      - "8000"
    restart: unless-stopped

  balanceador:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - servidor1
      - servidor2
      - servidor3
    restart: unless-stopped
